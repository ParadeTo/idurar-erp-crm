<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700"
     font-family="Arial, sans-serif" font-size="13" fill="#333">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1565C0"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#388E3C"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">
    Module Dependency Graph — IDURAR ERP/CRM
  </text>

  <!-- ─────────────────── FRONTEND HALF ─────────────────── -->
  <text x="240" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Frontend (React)</text>

  <!-- main.jsx -->
  <rect x="160" y="65" width="160" height="36" rx="5" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="240" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D47A1">main.jsx</text>

  <line x1="240" y1="101" x2="240" y2="128" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- RootApp.jsx -->
  <rect x="150" y="128" width="180" height="36" rx="5" fill="#DCEEFB" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="240" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D47A1">RootApp.jsx</text>

  <line x1="240" y1="164" x2="240" y2="193" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- IdurarOs -->
  <rect x="145" y="193" width="190" height="36" rx="5" fill="#EDE7F6" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="240" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A148C">IdurarOs (auth gate)</text>

  <!-- IdurarOs → AuthRouter -->
  <line x1="180" y1="229" x2="100" y2="268" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- IdurarOs → ErpApp -->
  <line x1="300" y1="229" x2="360" y2="268" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- AuthRouter -->
  <rect x="28" y="268" width="152" height="36" rx="5" fill="#FCE4EC" stroke="#C62828" stroke-width="1.5"/>
  <text x="104" y="291" text-anchor="middle" font-size="12" fill="#B71C1C">AuthRouter → AuthModule</text>

  <!-- ErpApp -->
  <rect x="300" y="268" width="152" height="36" rx="5" fill="#E8F5E9" stroke="#388E3C" stroke-width="1.5"/>
  <text x="376" y="291" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">ErpApp</text>

  <!-- ErpApp → Navigation + AppRouter -->
  <line x1="376" y1="304" x2="376" y2="338" stroke="#388E3C" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- AppRouter -->
  <rect x="292" y="338" width="168" height="36" rx="5" fill="#F1F8E9" stroke="#388E3C" stroke-width="1.5"/>
  <text x="376" y="361" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">AppRouter → Pages</text>

  <!-- AppRouter → Modules -->
  <line x1="376" y1="374" x2="240" y2="412" stroke="#388E3C" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Modules -->
  <rect x="100" y="412" width="280" height="52" rx="5" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/>
  <text x="240" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">Business Modules</text>
  <text x="240" y="452" text-anchor="middle" font-size="11" fill="#555">InvoiceModule · PaymentModule · QuoteModule</text>

  <!-- Modules → Redux -->
  <line x1="175" y1="464" x2="130" y2="512" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- Modules → Components -->
  <line x1="305" y1="464" x2="340" y2="512" stroke="#388E3C" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Redux -->
  <rect x="28" y="512" width="200" height="52" rx="5" fill="#FBE9E7" stroke="#E64A19" stroke-width="1.5"/>
  <text x="128" y="532" text-anchor="middle" font-size="12" font-weight="bold" fill="#BF360C">Redux Store</text>
  <text x="128" y="549" text-anchor="middle" font-size="11" fill="#555">erp · crud · auth · settings</text>

  <!-- Redux → request -->
  <line x1="128" y1="564" x2="128" y2="608" stroke="#1565C0" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Shared Components -->
  <rect x="260" y="512" width="200" height="52" rx="5" fill="#E8EAF6" stroke="#3949AB" stroke-width="1.5"/>
  <text x="360" y="532" text-anchor="middle" font-size="12" font-weight="bold" fill="#1A237E">Components/Layout</text>
  <text x="360" y="549" text-anchor="middle" font-size="11" fill="#555">DataTable · ErpLayout · forms</text>

  <!-- request/axios -->
  <rect x="28" y="608" width="200" height="36" rx="5" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.5"/>
  <text x="128" y="631" text-anchor="middle" font-size="12" font-weight="bold" fill="#37474F">request.js (axios)</text>

  <!-- request → API -->
  <line x1="228" y1="626" x2="476" y2="626" stroke="#607D8B" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="350" y="620" text-anchor="middle" font-size="11" fill="#777">REST calls → Backend /api/</text>

  <!-- ─────────────────── BACKEND HALF ─────────────────── -->
  <text x="730" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#388E3C">Backend (Node/Express)</text>

  <!-- server.js -->
  <rect x="628" y="65" width="204" height="36" rx="5" fill="#E8F5E9" stroke="#388E3C" stroke-width="1.5"/>
  <text x="730" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">server.js</text>

  <line x1="730" y1="101" x2="730" y2="128" stroke="#388E3C" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- app.js -->
  <rect x="620" y="128" width="220" height="36" rx="5" fill="#F1F8E9" stroke="#388E3C" stroke-width="1.5"/>
  <text x="730" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">app.js (Express setup)</text>

  <line x1="730" y1="164" x2="730" y2="193" stroke="#388E3C" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Routes -->
  <rect x="600" y="193" width="260" height="52" rx="5" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="730" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D47A1">Routes</text>
  <text x="730" y="233" text-anchor="middle" font-size="11" fill="#555">coreAuthRouter · coreApiRouter · erpApiRouter</text>

  <!-- Routes → Middleware -->
  <line x1="730" y1="245" x2="730" y2="282" stroke="#388E3C" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Middleware -->
  <rect x="608" y="282" width="244" height="36" rx="5" fill="#FFF9C4" stroke="#F9A825" stroke-width="1.5"/>
  <text x="730" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#F57F17">Middleware</text>

  <!-- Middleware → Controllers -->
  <line x1="730" y1="318" x2="730" y2="358" stroke="#388E3C" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Controllers -->
  <rect x="560" y="358" width="340" height="60" rx="5" fill="#FBE9E7" stroke="#C62828" stroke-width="1.5"/>
  <text x="730" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#B71C1C">Controllers</text>
  <text x="730" y="396" text-anchor="middle" font-size="11" fill="#555">adminAuth · settingController · invoiceController</text>
  <text x="730" y="412" text-anchor="middle" font-size="11" fill="#555">paymentController · clientController · createCRUDController</text>

  <!-- Controllers → Models -->
  <line x1="730" y1="418" x2="730" y2="462" stroke="#388E3C" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Models -->
  <rect x="560" y="462" width="340" height="52" rx="5" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5"/>
  <text x="730" y="482" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">Models (Mongoose Schemas)</text>
  <text x="730" y="499" text-anchor="middle" font-size="11" fill="#555">Admin · AdminPassword · Setting · Client · Invoice · Payment</text>

  <!-- Models → MongoDB -->
  <line x1="730" y1="514" x2="730" y2="558" stroke="#388E3C" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- MongoDB -->
  <rect x="610" y="558" width="240" height="36" rx="5" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="730" y="581" text-anchor="middle" font-size="12" font-weight="bold" fill="#0D47A1">MongoDB</text>

  <!-- models/utils auto-discovery note -->
  <rect x="560" y="610" width="340" height="42" rx="4" fill="#FAFAFA" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="730" y="628" text-anchor="middle" font-size="11" fill="#555">models/utils/index.js: glob scans appModels/</text>
  <text x="730" y="643" text-anchor="middle" font-size="11" fill="#555">→ auto-builds routesList + controller registry</text>

  <!-- Divider -->
  <line x1="490" y1="42" x2="490" y2="670" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="6,4"/>
</svg>
