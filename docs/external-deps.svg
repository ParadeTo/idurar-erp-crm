<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1450" viewBox="0 0 1400 1450" role="img" aria-labelledby="title desc">
  <title id="title">IDURAR external dependencies top-down</title>
  <desc id="desc">Top-down external dependencies derived from package files, env files, installation guide, Vite config, backend server, upload middleware, email service, PDF generator, and GitHub workflows.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#35515f"/>
    </marker>
    <style>
      .bg { fill: #f7faf8; }
      .title { font: 700 30px Arial, sans-serif; fill: #18323b; }
      .subtitle { font: 14px Arial, sans-serif; fill: #586b73; }
      .band { fill: #ffffff; stroke: #c8d7d3; stroke-width: 1.5; rx: 12; }
      .node { fill: #ffffff; stroke: #6a908d; stroke-width: 2; rx: 8; }
      .node-alt { fill: #fdf8ef; stroke: #b68b45; stroke-width: 2; rx: 8; }
      .node-warn { fill: #fff7f7; stroke: #c87979; stroke-width: 2; rx: 8; }
      .node-title { font: 700 17px Arial, sans-serif; fill: #1f3b43; }
      .node-text { font: 13px Arial, sans-serif; fill: #52646c; }
      .edge { stroke: #35515f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge-dash { stroke: #8b6f42; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1400" height="1450"/>
  <text class="title" x="54" y="54">外部依赖图</text>
  <text class="subtitle" x="54" y="82">自上而下：运行时 → 环境变量 → 实际使用的依赖 → 声明但未接入或未发现的依赖。</text>

  <rect class="band" x="60" y="125" width="1280" height="180"/>
  <text class="subtitle" x="86" y="155">1. 运行时</text>
  <rect class="node" x="425" y="190" width="550" height="72"/>
  <text class="node-title" x="453" y="220">IDURAR 运行时</text>
  <text class="node-text" x="453" y="244">前端 Vite React + 后端 Express/Mongoose；Node 20.9.0 / npm 10.2.4。</text>

  <rect class="band" x="60" y="365" width="1280" height="230"/>
  <text class="subtitle" x="86" y="395">2. 环境变量和配置入口</text>
  <rect class="node" x="115" y="440" width="260" height="90"/>
  <text class="node-title" x="139" y="470">DATABASE</text>
  <text class="node-text" x="139" y="494">安装说明要求 MongoDB URI。</text>
  <text class="node-text" x="139" y="516">server/setup/reset 都连接它。</text>
  <rect class="node" x="415" y="440" width="260" height="90"/>
  <text class="node-title" x="439" y="470">JWT_SECRET</text>
  <text class="node-text" x="439" y="494">jsonwebtoken 签发和校验 token。</text>
  <text class="node-text" x="439" y="516">前端发送 Bearer token。</text>
  <rect class="node" x="715" y="440" width="260" height="90"/>
  <text class="node-title" x="739" y="470">VITE_* env</text>
  <text class="node-text" x="739" y="494">VITE_BACKEND_SERVER。</text>
  <text class="node-text" x="739" y="516">VITE_FILE_BASE_URL / VITE_DEV_REMOTE。</text>
  <rect class="node" x="1015" y="440" width="260" height="90"/>
  <text class="node-title" x="1039" y="470">PUBLIC_SERVER_FILE</text>
  <text class="node-text" x="1039" y="494">PDF 模板拼接公司 logo URL。</text>
  <text class="node-text" x="1039" y="516">由 pdfController 使用。</text>

  <rect class="band" x="60" y="655" width="1280" height="255"/>
  <text class="subtitle" x="86" y="685">3. 实际使用的外部依赖</text>
  <rect class="node" x="115" y="730" width="260" height="100"/>
  <text class="node-title" x="139" y="760">MongoDB</text>
  <text class="node-text" x="139" y="784">保存 Admin/Setting/ERP 数据。</text>
  <text class="node-text" x="139" y="806">Mongoose models 访问它。</text>
  <rect class="node" x="415" y="730" width="260" height="100"/>
  <text class="node-title" x="439" y="760">本地文件系统</text>
  <text class="node-text" x="439" y="784">multer 写 src/public/uploads。</text>
  <text class="node-text" x="439" y="806">html-pdf 写 src/public/download。</text>
  <rect class="node" x="715" y="730" width="260" height="100"/>
  <text class="node-title" x="739" y="760">Resend</text>
  <text class="node-text" x="739" y="784">RESEND_API 创建客户端。</text>
  <text class="node-text" x="739" y="806">忘记密码邮件调用 emails.send。</text>
  <rect class="node" x="1015" y="730" width="260" height="100"/>
  <text class="node-title" x="1039" y="760">GitHub workflows</text>
  <text class="node-text" x="1039" y="784">CodeSee arch diagram workflow。</text>
  <text class="node-text" x="1039" y="806">github-repo-stats 定时统计。</text>

  <rect class="band" x="60" y="970" width="1280" height="260"/>
  <text class="subtitle" x="86" y="1000">4. 声明存在，但未发现主链路接入</text>
  <rect class="node-alt" x="235" y="1045" width="280" height="100"/>
  <text class="node-title" x="259" y="1075">DigitalOcean Spaces / S3</text>
  <text class="node-text" x="259" y="1099">@aws-sdk/client-s3 已声明。</text>
  <text class="node-text" x="259" y="1121">DoSingleStorage 读取 DO_SPACES_*，但未发现路由使用。</text>
  <rect class="node-alt" x="560" y="1045" width="280" height="100"/>
  <text class="node-title" x="584" y="1075">OpenAI</text>
  <text class="node-text" x="584" y="1099">openai 依赖和 OPENAI_API_KEY 读取存在。</text>
  <text class="node-text" x="584" y="1121">未发现 API 调用或业务控制器使用。</text>
  <rect class="node-warn" x="885" y="1045" width="280" height="100"/>
  <text class="node-title" x="909" y="1075">部署平台配置</text>
  <text class="node-text" x="909" y="1099">Dockerfile/docker-compose.yml 未发现。</text>
  <text class="node-text" x="909" y="1121">Vercel/Render/Fly/Railway 配置未发现。</text>

  <rect class="band" x="60" y="1290" width="1280" height="90"/>
  <text class="subtitle" x="86" y="1320">5. README 证据边界</text>
  <rect class="node-warn" x="270" y="1335" width="860" height="34"/>
  <text class="node-text" x="294" y="1358">翻译版 README 提到 docker-compose，但实际扫描仓库未发现 docker-compose.yml，因此图中标为未发现。</text>

  <path class="edge" d="M 700 262 L 245 440"/>
  <path class="edge" d="M 700 262 L 545 440"/>
  <path class="edge" d="M 700 262 L 845 440"/>
  <path class="edge" d="M 700 262 L 1145 440"/>
  <path class="edge" d="M 245 530 L 245 730"/>
  <path class="edge" d="M 1145 530 L 545 730"/>
  <path class="edge" d="M 545 530 L 245 730"/>
  <path class="edge" d="M 845 530 L 845 730"/>
  <path class="edge-dash" d="M 700 262 L 375 1045"/>
  <path class="edge-dash" d="M 700 262 L 700 1045"/>
  <path class="edge-dash" d="M 700 262 L 1025 1045"/>
</svg>
