<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" width="920" height="660"
     font-family="Arial, sans-serif" font-size="13" fill="#333">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <marker id="arrow-ext" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9C27B0"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">
    System Architecture — IDURAR ERP/CRM
  </text>

  <!-- ═══ Browser ═══ -->
  <rect x="335" y="45" width="250" height="52" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="460" y="67" text-anchor="middle" font-weight="bold" fill="#0D47A1">Browser</text>
  <text x="460" y="85" text-anchor="middle" font-size="11" fill="#555">User Client — Chrome / Firefox / Safari</text>

  <!-- Browser → Frontend -->
  <line x1="460" y1="97" x2="460" y2="148" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="128" font-size="11" fill="#777">HTTP (port 3000)</text>

  <!-- ═══ Frontend ═══ -->
  <rect x="160" y="148" width="600" height="68" rx="6" fill="#DCEEFB" stroke="#1E88E5" stroke-width="1.5"/>
  <text x="460" y="171" text-anchor="middle" font-weight="bold" fill="#0D47A1">Frontend — React 18 + Vite (port 3000)</text>
  <text x="460" y="189" text-anchor="middle" font-size="11" fill="#555">
    Redux Toolkit · Ant Design 5 · react-router-dom v6 · axios
  </text>
  <text x="460" y="207" text-anchor="middle" font-size="11" fill="#555">
    Modules: Invoice · Payment · Quote · Customer · Settings · Auth
  </text>

  <!-- Frontend → Backend -->
  <line x1="460" y1="216" x2="460" y2="275" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="252" font-size="11" fill="#777">REST API + Bearer JWT (axios)</text>

  <!-- ═══ Backend ═══ -->
  <rect x="60" y="275" width="800" height="148" rx="6" fill="#E8F5E9" stroke="#388E3C" stroke-width="1.5"/>
  <text x="460" y="297" text-anchor="middle" font-weight="bold" fill="#1B5E20">Backend — Express.js · Node.js v20 (port 8888)</text>

  <!-- Route sub-boxes -->
  <rect x="80" y="308" width="195" height="44" rx="4" fill="#fff" stroke="#81C784" stroke-width="1"/>
  <text x="178" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">/api (public)</text>
  <text x="178" y="342" text-anchor="middle" font-size="10" fill="#555">login · logout · forget/reset pwd</text>

  <rect x="290" y="308" width="220" height="44" rx="4" fill="#fff" stroke="#81C784" stroke-width="1"/>
  <text x="400" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">/api (JWT-protected)</text>
  <text x="400" y="342" text-anchor="middle" font-size="10" fill="#555">admin · setting · invoice · client · payment</text>

  <rect x="525" y="308" width="155" height="44" rx="4" fill="#fff" stroke="#81C784" stroke-width="1"/>
  <text x="603" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">/download</text>
  <text x="603" y="342" text-anchor="middle" font-size="10" fill="#555">PDF file download (html-pdf)</text>

  <rect x="695" y="308" width="145" height="44" rx="4" fill="#fff" stroke="#81C784" stroke-width="1"/>
  <text x="768" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#2E7D32">/public</text>
  <text x="768" y="342" text-anchor="middle" font-size="10" fill="#555">static assets</text>

  <!-- Middleware strip -->
  <rect x="80" y="362" width="760" height="32" rx="4" fill="#F1F8E9" stroke="#AED581" stroke-width="1"/>
  <text x="460" y="378" text-anchor="middle" font-size="11" fill="#33691E">
    Middleware: isValidAuthToken (JWT) · express-rate-limit · Multer upload · errorHandlers
  </text>
  <text x="460" y="393" text-anchor="middle" font-size="10" fill="#555">
    Controllers: adminAuth · adminController · settingController · invoiceController · paymentController · clientController · createCRUDController (factory)
  </text>

  <!-- Backend → MongoDB -->
  <line x1="215" y1="423" x2="145" y2="480" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="462" font-size="11" fill="#777">Mongoose ODM</text>

  <!-- ═══ MongoDB ═══ -->
  <rect x="40" y="480" width="250" height="60" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5"/>
  <text x="165" y="506" text-anchor="middle" font-weight="bold" fill="#E65100">MongoDB</text>
  <text x="165" y="523" text-anchor="middle" font-size="11" fill="#555">Admin · AdminPassword · Setting</text>
  <text x="165" y="538" text-anchor="middle" font-size="11" fill="#555">Client · Invoice · Payment</text>

  <!-- Backend → Local Storage -->
  <line x1="415" y1="423" x2="390" y2="480" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══ Local File Storage ═══ -->
  <rect x="315" y="480" width="210" height="60" rx="6" fill="#FFF9C4" stroke="#F9A825" stroke-width="1.5"/>
  <text x="420" y="506" text-anchor="middle" font-weight="bold" fill="#F57F17">Local File Storage</text>
  <text x="420" y="523" text-anchor="middle" font-size="11" fill="#555">src/public/uploads/ (Multer)</text>
  <text x="420" y="538" text-anchor="middle" font-size="11" fill="#555">or AWS S3 (@aws-sdk/client-s3)</text>

  <!-- Backend → External Services -->
  <line x1="640" y1="423" x2="680" y2="480" stroke="#9C27B0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-ext)"/>

  <!-- ═══ External Services ═══ -->
  <rect x="555" y="480" width="325" height="60" rx="6" fill="#F3E5F5" stroke="#8E24AA" stroke-width="1.5"/>
  <text x="718" y="506" text-anchor="middle" font-weight="bold" fill="#4A148C">External Services</text>
  <text x="718" y="523" text-anchor="middle" font-size="11" fill="#555">html-pdf + pug (PDF gen) · Resend (email, premium)</text>
  <text x="718" y="538" text-anchor="middle" font-size="11" fill="#555">OpenAI API · AWS S3</text>

  <!-- ═══ Env Vars note ═══ -->
  <rect x="60" y="565" width="800" height="42" rx="4" fill="#FAFAFA" stroke="#BDBDBD" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="460" y="582" text-anchor="middle" font-size="11" fill="#555">
    Required env vars: DATABASE · JWT_SECRET · PUBLIC_SERVER_FILE
  </text>
  <text x="460" y="598" text-anchor="middle" font-size="11" fill="#888">
    Optional: RESEND_API · OPENAI_API_KEY · VITE_BACKEND_SERVER · VITE_FILE_BASE_URL
  </text>

  <!-- ═══ Deploy note ═══ -->
  <text x="460" y="630" text-anchor="middle" font-size="11" fill="#888">
    Sponsor: DigitalOcean · Self-host or cloud.idurarapp.com (enterprise)
  </text>
</svg>
