name: Test

# Trigger on every push to every branch, and on all PR events.
# Concurrency cancels redundant runs on the same ref so fast-pushers
# don't queue up stale jobs.
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests (Node 20)
    runs-on: ubuntu-latest

    # All `run` steps execute inside backend/ unless overridden
    defaults:
      run:
        working-directory: backend

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Node + npm cache ─────────────────────────────────────────────────────
      # setup-node caches the *npm download cache* (~/.npm), keyed on
      # package-lock.json. `npm ci` is then fast on cache hits.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # ── Pin npm version ───────────────────────────────────────────────────────
      # npm 10.8.x crashes with "Exit handler never called!" when installing
      # packages that include phantomjs-prebuilt (via html-pdf). The crash
      # exits 0 but leaves node_modules/.bin/ incomplete, so jest is never found.
      # Pin to the version the project was developed with (package.json engines).
      - name: Pin npm to project version (10.2.4)
        run: npm install -g npm@10.2.4
        working-directory: ${{ github.workspace }}

      # ── MongoDB binary cache ──────────────────────────────────────────────────
      # mongodb-memory-server downloads a real mongod binary at test runtime
      # (~100 MB, 30-60 s). Cache it between runs keyed on the package-lock so
      # it re-downloads only when the dependency version changes.
      # MONGOMS_PREFER_GLOBAL_PATH=1 forces the binary to this fixed directory.
      - name: Cache mongod binary (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongoms-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            mongoms-${{ runner.os }}-

      # ── Install ───────────────────────────────────────────────────────────────
      # --ignore-scripts skips postinstall hooks. Without it, phantomjs-prebuilt
      # (pulled in by html-pdf) tries to download the PhantomJS binary in CI,
      # crashes with "npm error Exit handler never called!", and leaves
      # node_modules/.bin/ incomplete — so jest is never found.
      # .bin symlinks are created by npm's link step (not scripts), so jest
      # remains fully accessible after this flag.
      # mongodb-memory-server will download its mongod binary at test runtime
      # from the cache restored above instead of during postinstall.
      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_ENV: development

      # ── Test ──────────────────────────────────────────────────────────────────
      # Call jest directly instead of via `npm test` to bypass .bin symlinks.
      # Even when npm crashes internally, packages are already extracted to
      # node_modules/, so the direct path is always resolvable.
      # The job fails (and blocks merge) whenever any test fails.
      - name: Run tests
        run: node node_modules/jest/bin/jest.js --runInBand --json --outputFile=test-results.json
        env:
          NODE_ENV: test
          # Tell mongodb-memory-server to use the cached directory above
          MONGOMS_PREFER_GLOBAL_PATH: 1

      # ── Artifact ──────────────────────────────────────────────────────────────
      # Upload even on failure so you can inspect which tests broke.
      # Find it under Actions → run → Artifacts → test-results.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/test-results.json
          # Retention: 14 days is enough for PR review; default is 90.
          retention-days: 14
          if-no-files-found: warn
