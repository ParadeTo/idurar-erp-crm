<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" width="960" height="820"
     font-family="Arial, sans-serif" font-size="13" fill="#333">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9C27B0"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">
    Backend Architecture — IDURAR ERP/CRM
  </text>

  <!-- ═══ Entry: server.js ═══ -->
  <rect x="340" y="42" width="280" height="60" rx="6" fill="#E8F5E9" stroke="#388E3C" stroke-width="1.5"/>
  <text x="480" y="64" text-anchor="middle" font-weight="bold" fill="#1B5E20">server.js — Entry Point</text>
  <text x="480" y="81" text-anchor="middle" font-size="11" fill="#555">dotenv · mongoose.connect(DATABASE)</text>
  <text x="480" y="96" text-anchor="middle" font-size="11" fill="#555">glob-load all models → start Express on PORT 8888</text>

  <line x1="480" y1="102" x2="480" y2="142" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══ app.js ═══ -->
  <rect x="250" y="142" width="460" height="60" rx="6" fill="#F1F8E9" stroke="#388E3C" stroke-width="1.5"/>
  <text x="480" y="164" text-anchor="middle" font-weight="bold" fill="#2E7D32">app.js — Express Application</text>
  <text x="480" y="181" text-anchor="middle" font-size="11" fill="#555">cors · cookieParser · express.json · compression</text>
  <text x="480" y="196" text-anchor="middle" font-size="11" fill="#555">Mounts: /api (auth) · /api (protected) · /download · /public</text>

  <line x1="480" y1="202" x2="480" y2="242" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══ Routes Layer ═══ -->
  <rect x="40" y="242" width="880" height="80" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="480" y="263" text-anchor="middle" font-weight="bold" fill="#0D47A1">Routes Layer (src/routes/)</text>

  <rect x="58" y="273" width="175" height="38" rx="4" fill="#fff" stroke="#90CAF9" stroke-width="1"/>
  <text x="146" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">coreAuthRouter</text>
  <text x="146" y="304" text-anchor="middle" font-size="10" fill="#555">POST login/logout/forget/reset</text>

  <rect x="248" y="273" width="200" height="38" rx="4" fill="#fff" stroke="#90CAF9" stroke-width="1"/>
  <text x="348" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">coreApiRouter</text>
  <text x="348" y="304" text-anchor="middle" font-size="10" fill="#555">admin profile · setting CRUD</text>

  <rect x="463" y="273" width="230" height="38" rx="4" fill="#fff" stroke="#90CAF9" stroke-width="1"/>
  <text x="578" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">erpApiRouter (appApi.js)</text>
  <text x="578" y="304" text-anchor="middle" font-size="10" fill="#555">CRUD for every appModel (auto-generated)</text>

  <rect x="708" y="273" width="200" height="38" rx="4" fill="#fff" stroke="#90CAF9" stroke-width="1"/>
  <text x="808" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">coreDownloadRouter</text>
  <text x="808" y="304" text-anchor="middle" font-size="10" fill="#555">GET /download/:dir/:file → PDF</text>

  <line x1="480" y1="322" x2="480" y2="365" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══ Middleware ═══ -->
  <rect x="160" y="365" width="640" height="52" rx="6" fill="#FFF9C4" stroke="#F9A825" stroke-width="1.5"/>
  <text x="480" y="386" text-anchor="middle" font-weight="bold" fill="#F57F17">Middleware (applied before controllers)</text>
  <text x="480" y="403" text-anchor="middle" font-size="11" fill="#555">
    isValidAuthToken (JWT verify + session check) · singleStorageUpload (Multer) · express-rate-limit
  </text>

  <line x1="480" y1="417" x2="480" y2="460" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══ Controllers ═══ -->
  <rect x="40" y="460" width="880" height="100" rx="6" fill="#FBE9E7" stroke="#C62828" stroke-width="1.5"/>
  <text x="480" y="481" text-anchor="middle" font-weight="bold" fill="#B71C1C">Controllers (src/controllers/)</text>

  <!-- Core controllers -->
  <rect x="58" y="490" width="158" height="32" rx="4" fill="#fff" stroke="#EF9A9A" stroke-width="1"/>
  <text x="137" y="505" text-anchor="middle" font-size="11" font-weight="bold" fill="#B71C1C">adminAuth</text>
  <text x="137" y="518" text-anchor="middle" font-size="10" fill="#555">login · JWT issue · logout</text>

  <rect x="228" y="490" width="168" height="32" rx="4" fill="#fff" stroke="#EF9A9A" stroke-width="1"/>
  <text x="312" y="505" text-anchor="middle" font-size="11" font-weight="bold" fill="#B71C1C">adminController</text>
  <text x="312" y="518" text-anchor="middle" font-size="10" fill="#555">profile read/update/password</text>

  <rect x="408" y="490" width="165" height="32" rx="4" fill="#fff" stroke="#EF9A9A" stroke-width="1"/>
  <text x="491" y="505" text-anchor="middle" font-size="11" font-weight="bold" fill="#B71C1C">settingController</text>
  <text x="491" y="518" text-anchor="middle" font-size="10" fill="#555">CRUD · readBySettingKey</text>

  <rect x="584" y="490" width="168" height="32" rx="4" fill="#fff" stroke="#EF9A9A" stroke-width="1"/>
  <text x="668" y="505" text-anchor="middle" font-size="11" font-weight="bold" fill="#B71C1C">invoiceController</text>
  <text x="668" y="518" text-anchor="middle" font-size="10" fill="#555">create · read · update · mail · pdf</text>

  <rect x="763" y="490" width="145" height="32" rx="4" fill="#fff" stroke="#EF9A9A" stroke-width="1"/>
  <text x="836" y="505" text-anchor="middle" font-size="11" font-weight="bold" fill="#B71C1C">clientController</text>
  <text x="836" y="518" text-anchor="middle" font-size="10" fill="#555">summary · CRUD</text>

  <!-- createCRUDController note -->
  <text x="480" y="550" text-anchor="middle" font-size="11" fill="#555">
    createCRUDController(ModelName) factory auto-builds: create · read · update · delete · list · listAll · search · filter · summary
  </text>

  <line x1="480" y1="560" x2="480" y2="602" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══ Models ═══ -->
  <rect x="40" y="602" width="880" height="78" rx="6" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5"/>
  <text x="480" y="622" text-anchor="middle" font-weight="bold" fill="#E65100">Models — Mongoose Schemas (src/models/)</text>

  <!-- Core models -->
  <rect x="58" y="632" width="125" height="36" rx="4" fill="#fff" stroke="#FFB74D" stroke-width="1"/>
  <text x="121" y="647" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">Admin</text>
  <text x="121" y="661" text-anchor="middle" font-size="10" fill="#555">name · email · photo</text>

  <rect x="195" y="632" width="145" height="36" rx="4" fill="#fff" stroke="#FFB74D" stroke-width="1"/>
  <text x="268" y="647" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">AdminPassword</text>
  <text x="268" y="661" text-anchor="middle" font-size="10" fill="#555">hash · loggedSessions[]</text>

  <rect x="352" y="632" width="125" height="36" rx="4" fill="#fff" stroke="#FFB74D" stroke-width="1"/>
  <text x="415" y="647" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">Setting</text>
  <text x="415" y="661" text-anchor="middle" font-size="10" fill="#555">settingKey · settingValue</text>

  <rect x="490" y="632" width="125" height="36" rx="4" fill="#fff" stroke="#FFB74D" stroke-width="1"/>
  <text x="553" y="647" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">Client</text>
  <text x="553" y="661" text-anchor="middle" font-size="10" fill="#555">name · email · phone · country</text>

  <rect x="628" y="632" width="140" height="36" rx="4" fill="#fff" stroke="#FFB74D" stroke-width="1"/>
  <text x="698" y="647" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">Invoice</text>
  <text x="698" y="661" text-anchor="middle" font-size="10" fill="#555">→ Client, Admin · items[] · status</text>

  <rect x="780" y="632" width="128" height="36" rx="4" fill="#fff" stroke="#FFB74D" stroke-width="1"/>
  <text x="844" y="647" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">Payment</text>
  <text x="844" y="661" text-anchor="middle" font-size="10" fill="#555">→ Invoice, Client · amount</text>

  <line x1="480" y1="680" x2="480" y2="720" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══ MongoDB ═══ -->
  <rect x="290" y="720" width="380" height="50" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="480" y="742" text-anchor="middle" font-weight="bold" fill="#0D47A1">MongoDB (mongoose-autopopulate)</text>
  <text x="480" y="759" text-anchor="middle" font-size="11" fill="#555">Atlas cluster or local · DATABASE env var</text>

  <!-- External integrations note -->
  <text x="480" y="796" text-anchor="middle" font-size="11" fill="#888">
    PDF: pdfController (pug + html-pdf) · Email: Resend (premium stub in OSS) · AI: openai SDK
  </text>
</svg>
