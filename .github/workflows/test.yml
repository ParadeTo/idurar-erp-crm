name: Test

# Trigger on every push to every branch, and on all PR events.
# Concurrency cancels redundant runs on the same ref so fast-pushers
# don't queue up stale jobs.
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests (Node 20)
    runs-on: ubuntu-latest

    # All `run` steps execute inside backend/ unless overridden
    defaults:
      run:
        working-directory: backend

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Node + npm cache ─────────────────────────────────────────────────────
      # setup-node caches the *npm download cache* (~/.npm), keyed on
      # package-lock.json. `npm ci` is then fast on cache hits.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # ── MongoDB binary cache ──────────────────────────────────────────────────
      # mongodb-memory-server downloads a real mongod binary at test runtime
      # (~100 MB, 30-60 s). Cache it between runs keyed on the package-lock so
      # it re-downloads only when the dependency version changes.
      # MONGOMS_PREFER_GLOBAL_PATH=1 forces the binary to this fixed directory.
      - name: Cache mongod binary (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongoms-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            mongoms-${{ runner.os }}-

      # ── Install ───────────────────────────────────────────────────────────────
      # NODE_ENV=development prevents npm from skipping devDependencies.
      # When NODE_ENV=production (possible on some runners), npm ci omits them,
      # leaving jest absent and causing "jest: not found" at runtime.
      # --include=dev is a second safeguard for npm 8+ explicit omit logic.
      - name: Install dependencies
        run: npm ci --include=dev
        env:
          NODE_ENV: development

      # ── Test ──────────────────────────────────────────────────────────────────
      # --json writes a machine-readable report uploaded as artifact below.
      # The job fails (and blocks merge) whenever any test fails.
      - name: Run tests
        run: npm test -- --json --outputFile=test-results.json
        env:
          NODE_ENV: test
          # Tell mongodb-memory-server to use the cached directory above
          MONGOMS_PREFER_GLOBAL_PATH: 1

      # ── Artifact ──────────────────────────────────────────────────────────────
      # Upload even on failure so you can inspect which tests broke.
      # Find it under Actions → run → Artifacts → test-results.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/test-results.json
          # Retention: 14 days is enough for PR review; default is 90.
          retention-days: 14
          if-no-files-found: warn
